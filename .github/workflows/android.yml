name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Install Android compilation tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes)
          "$sdkmanager" 'platforms;android-37.2' 'build-tools;36.0.0'

      - name: Build APKs and run JVM tests and lint
        run: >-
          ./gradlew --max-workers=2 :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm

      - name: Run Android 12 native checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 440
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r app.cameraderie.test/app.cameraderie.NativeChecks | tr -d '\r' | tee "$RUNNER_TEMP/native-checks.txt"
            grep -Eq '^INSTRUMENTATION_RESULT: tests=[1-9][0-9]*$' "$RUNNER_TEMP/native-checks.txt"
            grep -qx 'INSTRUMENTATION_RESULT: failures=0' "$RUNNER_TEMP/native-checks.txt"
            grep -qx 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/native-checks.txt"

      - name: Verify the external shared-module override
        env:
          CAMERA_MODULES_REVISION: 8b893f73714de40002f211bfdd4d6931453194bb
        run: |
          modules=$(mktemp -d "$RUNNER_TEMP/camera-modules.XXXXXX")
          git archive "$CAMERA_MODULES_REVISION" camera-core camera-dji-ble | tar -x -C "$modules"
          ./gradlew --max-workers=2 --rerun-tasks "-PcameraModulesDir=$modules" :app:testDebugUnitTest :app:assembleDebug
